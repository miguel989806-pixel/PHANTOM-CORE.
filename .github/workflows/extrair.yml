
name: Extrair PHANTOM CORE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p /tmp/phantom
          unzip -oq PHANTOM-CORE-PS4-COMPLETO.zip -d /tmp/phantom

          test -d /tmp/phantom/PHANTOM-CORE
          cp -a /tmp/phantom/PHANTOM-CORE/. .

      - name: Sincronizar e salvar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extrair PHANTOM CORE" || true

          for tentativa in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Arquivos enviados com sucesso!"
              exit 0
            fi
            sleep 2
          done

          echo "Falha ao sincronizar com a branch main"
          exit 1
