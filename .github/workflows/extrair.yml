
name: Extrair PHANTOM-CORE PS4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p /tmp/phantom
          unzip -o PHANTOM-CORE-PS4-COMPLETO.zip -d /tmp/phantom

          cp -a /tmp/phantom/PHANTOM-CORE/. .

          mkdir -p .github/workflows
          cp ps4-native/.github/workflows/build.yml \
            .github/workflows/build-ps4.yml

          rm -f ps4-native/.github/workflows/build.yml

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extrair PHANTOM-CORE PS4" || echo "Sem alterações"
          git push
