
name: Extrair PHANTOM CORE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p /tmp/phantom
          unzip -oq PHANTOM-CORE-PS4-COMPLETO.zip -d /tmp/phantom

          cp -a /tmp/phantom/PHANTOM-CORE/. .

      - name: Sincronizar e salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extrair PHANTOM CORE" || true

          git pull --rebase origin main
          git push origin HEAD:main
